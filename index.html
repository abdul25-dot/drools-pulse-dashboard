<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DROOLS PULSE — Sales & Market Intelligence</title><script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script><style>
:root{--bg:#061526;--side:#041323;--card:#0d2238;--line:#1d3852;--gold:#f5a623;--txt:#f4f7fb;--muted:#8ba0b5;--green:#46d3a2;--red:#ff7584}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:14px Inter,ui-sans-serif,system-ui,Segoe UI,sans-serif}button,input,select{font:inherit}.layout{display:flex;min-height:100vh}.side{width:238px;background:var(--side);border-right:1px solid #162b40;padding:22px 14px;display:flex;flex-direction:column;position:fixed;inset:0 auto 0 0;z-index:5}.brand{padding:3px 12px 26px}.brand b{font-size:18px;letter-spacing:2px}.brand span{display:block;color:var(--muted);font-size:11px;margin-top:5px}.nav{display:grid;gap:6px}.nav button{background:none;border:0;color:#aab9c7;text-align:left;padding:12px;border-radius:9px;cursor:pointer}.nav button:hover,.nav button.active{background:#10283e;color:white}.nav button.active{box-shadow:inset 3px 0 var(--gold)}.contact{margin-top:auto;padding:14px 10px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}.contact a{color:var(--gold);display:block;margin-top:6px}.main{margin-left:238px;padding:26px 30px;width:calc(100% - 238px);max-width:1800px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}.eyebrow{color:var(--gold);font-size:11px;letter-spacing:1.8px;font-weight:700}.top h1{font-size:25px;margin:5px 0 0}.topright{display:flex;align-items:center;gap:12px}.stamp{font-size:11px;color:var(--muted);text-align:right}.btn{border:1px solid var(--line);background:#112b43;color:white;padding:10px 14px;border-radius:8px;cursor:pointer}.btn.primary{background:var(--gold);color:#1d1a12;border-color:var(--gold);font-weight:700}.btn:hover{filter:brightness(1.1)}.filters{display:flex;flex-wrap:wrap;align-items:end;gap:10px;background:#0a1d30;border:1px solid var(--line);padding:13px;border-radius:10px;margin-bottom:20px}.field{display:grid;gap:5px}.field label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px}.field select,.field input{background:#10283e;color:white;border:1px solid var(--line);border-radius:7px;padding:8px;min-width:125px}.sectionhead{display:flex;align-items:center;justify-content:space-between;margin:4px 0 14px}.sectionhead h2{font-size:19px;margin:0}.sub{color:var(--muted);font-size:12px}.grid{display:grid;gap:14px}.kpis{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:16px}.card{background:var(--card);border:1px solid #18334c;border-radius:12px;padding:17px;min-width:0}.kpi .label{color:var(--muted);font-size:12px}.kpi .value{font-size:25px;font-weight:700;margin-top:10px;letter-spacing:-.5px}.kpi .hint{font-size:11px;color:var(--muted);margin-top:6px}.charts{grid-template-columns:repeat(2,minmax(0,1fr))}.card h3{margin:0 0 14px;font-size:14px}.chart{height:245px;position:relative;overflow:auto}.chart svg{width:100%;height:100%;overflow:visible}.chart text{fill:#9eb1c2;font-size:10px}.chart .axis{stroke:#35516a;stroke-width:1}.chart .bar{fill:var(--gold)}.chart .line{fill:none;stroke:var(--gold);stroke-width:2.5}.chart .dot{fill:var(--gold)}.full{grid-column:1/-1}.insights{display:grid;gap:8px}.insight{border-left:3px solid var(--gold);padding:9px 12px;background:#10283e;border-radius:0 8px 8px 0;color:#dce5ec;font-size:13px}.pill{display:inline-block;border-radius:99px;padding:3px 8px;background:#17354e;color:#b6cad9;font-size:10px}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;white-space:nowrap;font-size:12px}.table th{text-align:left;color:var(--muted);font-weight:600;padding:10px;border-bottom:1px solid var(--line);cursor:pointer}.table td{padding:10px;border-bottom:1px solid #183149}.table tr:hover td{background:#10283e}.table input{background:#10283e;border:1px solid var(--line);border-radius:6px;color:white;padding:8px}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:10px}.hidden{display:none!important}.empty{text-align:center;padding:55px 20px;border:1px dashed #29445e;border-radius:12px;color:var(--muted)}.modalback{position:fixed;inset:0;background:#0009;display:grid;place-items:center;z-index:20}.modal{background:#0b1e31;border:1px solid var(--line);width:min(850px,94vw);max-height:90vh;overflow:auto;border-radius:14px;padding:22px}.modal h2{margin-top:0}.mapgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.quality{display:flex;gap:9px;flex-wrap:wrap;margin:12px 0}.quality span{background:#10283e;border-radius:7px;padding:8px 10px;font-size:12px}.notice{color:#f3c36b;background:#302719;padding:10px;border-radius:8px;margin:10px 0;font-size:12px}.period{color:var(--muted);font-size:11px}.pagination{display:flex;justify-content:space-between;align-items:center;padding:10px;color:var(--muted)}@media(max-width:900px){.side{width:66px;padding:18px 7px}.brand{padding:4px 8px 22px}.brand b{font-size:11px;letter-spacing:0}.brand span,.nav .navlabel,.contact{display:none}.nav button{text-align:center;font-size:18px;padding:12px 5px}.main{margin-left:66px;width:calc(100% - 66px);padding:20px 15px}.kpis{grid-template-columns:repeat(2,1fr)}}@media(max-width:620px){.top{align-items:flex-start}.top h1{font-size:20px}.topright{flex-direction:column;align-items:flex-end}.stamp{display:none}.charts{grid-template-columns:1fr}.kpis{gap:8px}.kpi{padding:12px}.kpi .value{font-size:20px}.filters .field{flex:1}.mapgrid{grid-template-columns:1fr 1fr}}
</style></head><body><div class="layout"><aside class="side"><div class="brand"><b>DROOLS PULSE</b><span>Sales & Market Intelligence</span></div><nav class="nav" id="nav"><button data-page="Executive Dashboard" class="active">◈ <span class="navlabel">Executive Dashboard</span></button><button data-page="Distributors">◉ <span class="navlabel">Distributors</span></button><button data-page="Retail Intelligence">▦ <span class="navlabel">Retail Intelligence</span></button><button data-page="Product Performance">◌ <span class="navlabel">Product Performance</span></button><button data-page="Saved Items">▣ <span class="navlabel">Saved Items</span></button></nav><div class="contact">Contact<a href="mailto:syed4152@gmail.com">syed4152@gmail.com</a></div></aside><main class="main"><header class="top"><div><div class="eyebrow">DROOLS PULSE</div><h1 id="pagetitle">Executive Dashboard</h1></div><div class="topright"><div class="stamp"><div id="filename">No data loaded</div><div id="analyzed">Awaiting first analysis</div></div><label class="btn primary">↑ Upload Excel File<input id="file" type="file" accept=".xlsx,.xls,.csv" multiple hidden></label></div></header><div id="app"></div></main></div><div id="modalroot"></div>
<script>
const FIELDS=['date','order','distributor','region','retailer','sku','product','category','units','revenue','status','repeat'];
const LABEL={date:'Date',order:'Order ID',distributor:'Distributor',region:'Region',retailer:'Retailer',sku:'SKU',product:'Product',category:'Category',units:'Units',revenue:'Revenue',status:'Order Status',repeat:'Repeat Order'};
const ALIASES={date:['date','order date','invoice date','transaction date'],order:['order id','order','invoice number','invoice no','order number'],distributor:['distributor','distributor name','distributor id'],region:['region','state','country','area'],retailer:['retailer','retailer name','retailer id','outlet'],sku:['sku','sku code','product code','item code'],product:['product','product name','item'],category:['category','product category'],units:['units','quantity','units sold','qty'],revenue:['revenue','net sales','sales value','amount','sales'],status:['order status','status'],repeat:['repeat order']};
const CATS=['Dog Dry Food','Cat Dry Food','Wet Food','Dog Treats','Cat Treats','Biscuits','Functional Pet Nutrition','Veterinary Diet Food','Supplements & Health Products','Chews & Sausages','Cat Litter','Pet Toys & Accessories','Unmapped / Other'];
let files=[],sheets=[],raw=[],rows=[],map={},activePage='Executive Dashboard',sort={key:'Revenue',dir:-1},pageNum=1,tableLimit=10;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function norm(s){return String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim()}
function detect(headers){const m={}; for(const f of FIELDS){let candidates=ALIASES[f];let h=headers.find(x=>candidates.includes(norm(x)))||headers.find(x=>candidates.some(a=>norm(x).includes(a)));if(h)m[f]=h}return m}
function num(v){if(typeof v==='number')return Number.isFinite(v)?v:null;if(v==null||String(v).trim()==='')return null;let n=Number(String(v).replace(/[₹$€£,\s]/g,''));return Number.isFinite(n)?n:null}
function parseDate(v){if(v instanceof Date&&!isNaN(v))return v;if(typeof v==='number'&&window.XLSX)return XLSX.SSF.parse_date_code(v)?new Date(Date.UTC(...Object.values(XLSX.SSF.parse_date_code(v)).slice(0,3))):null;let d=new Date(v);return isNaN(d)?null:d}
function canonical(r){let o={_raw:r}; for(const f of FIELDS){let v=map[f]?r[map[f]]:null;o[f]=v}o._date=parseDate(o.date);o._revenue=num(o.revenue);o._units=num(o.units);o._status=String(o.status??'').toLowerCase();return o}
function isValid(r){return !/(cancel|void)/.test(r._status)}
function analyze(){const seen=new Set();rows=raw.map(canonical).filter(r=>{let k=JSON.stringify(r._raw);if(seen.has(k))return false;seen.add(k);return true});document.getElementById('filename').textContent=files.map(f=>f.name).join(', ');document.getElementById('analyzed').textContent='Last analysis: '+new Date().toLocaleString();render()}
document.getElementById('file').addEventListener('change',async e=>{files=[...e.target.files];sheets=[];for(const f of files){if(f.name.toLowerCase().endsWith('.csv')){const t=await f.text();if(window.XLSX){const w=XLSX.read(t,{type:'string'});for(const n of w.SheetNames)sheets.push({name:f.name+' / '+n,rows:XLSX.utils.sheet_to_json(w.Sheets[n],{defval:null})})}else sheets.push({name:f.name,rows:csvParse(t)})}else{if(!window.XLSX){alert('Excel reading requires a connection to load SheetJS. CSV uploads work without it.');return}const w=XLSX.read(await f.arrayBuffer(),{type:'array',cellDates:true});for(const n of w.SheetNames)sheets.push({name:f.name+' / '+n,rows:XLSX.utils.sheet_to_json(w.Sheets[n],{defval:null})})}}showSetup()});
function csvParse(t){let lines=t.replace(/^\uFEFF/,'').split(/\r?\n/).filter(x=>x.trim()),parseLine=s=>{let a=[],q=false,v='';for(let i=0;i<s.length;i++){let c=s[i];if(c==='"'&&s[i+1]==='"'&&q){v+='"';i++}else if(c==='"')q=!q;else if(c===','&&!q){a.push(v);v=''}else v+=c}a.push(v);return a};let h=parseLine(lines.shift());return lines.map(l=>Object.fromEntries(h.map((k,i)=>[k,parseLine(l)[i]??''])))}
function showSetup(){const root=document.getElementById('modalroot');const options=sheets.map((s,i)=>`<option value="${i}">${esc(s.name)} (${s.rows.length} rows)</option>`).join('');let first=sheets[0]?.rows||[],headers=Object.keys(first[0]||{});map=detect(headers);root.innerHTML=`<div class="modalback"><div class="modal"><h2>Review uploaded data</h2><div class="sub">Choose a worksheet, confirm the field mappings, then analyze locally in this browser.</div><div class="field" style="margin-top:16px"><label>Worksheet</label><select id="sheet">${options}</select></div><div id="mappings"></div><div id="quality"></div><div class="notice">Rows marked cancelled/void are excluded from revenue and order totals. Duplicate rows are flagged and exact duplicates are excluded. Returns and negative values remain as supplied. Original file contents are not changed.</div><div style="display:flex;justify-content:flex-end;gap:9px;margin-top:16px"><button class="btn" id="cancelsetup">Cancel</button><button class="btn primary" id="confirmsetup">Analyze data</button></div></div></div>`;const update=()=>{let s=sheets[+document.getElementById('sheet').value];headers=Object.keys(s.rows[0]||{});map=detect(headers);document.getElementById('mappings').innerHTML=`<h3 style="margin-top:20px">Column mapping</h3><div class="mapgrid">${FIELDS.map(f=>`<div class="field"><label>${LABEL[f]}</label><select data-map="${f}"><option value="">Not available</option>${headers.map(h=>`<option ${map[f]===h?'selected':''} value="${esc(h)}">${esc(h)}</option>`).join('')}</select></div>`).join('')}</div>`;document.querySelectorAll('[data-map]').forEach(x=>x.onchange=()=>map[x.dataset.map]=x.value||null);let dup=s.rows.length-new Set(s.rows.map(x=>JSON.stringify(x))).size;document.getElementById('quality').innerHTML=`<div class="quality"><span>Rows: ${s.rows.length}</span><span>Columns: ${headers.length}</span><span>Exact duplicates: ${dup}</span><span>Worksheets: ${sheets.length}</span></div>`};document.getElementById('sheet').onchange=update;update();document.getElementById('cancelsetup').onclick=()=>root.innerHTML='';document.getElementById('confirmsetup').onclick=()=>{const s=sheets[+document.getElementById('sheet').value];raw=s.rows;for(const f of FIELDS){let el=document.querySelector(`[data-map="${f}"]`);map[f]=el?.value||null}root.innerHTML='';analyze()}}
document.getElementById('nav').onclick=e=>{let b=e.target.closest('button[data-page]');if(!b)return;activePage=b.dataset.page;document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x===b));document.getElementById('pagetitle').textContent=activePage;render()};
function val(r,f){return String(r[f]??'').trim()||'N/A'}function distinct(a,f){return new Set(a.map(r=>val(r,f)).filter(x=>x!=='N/A')).size}function sum(a,f){return a.reduce((s,r)=>s+(r[f]??0),0)}function fmt(n){return n==null?'N/A':new Intl.NumberFormat('en-IN',{maximumFractionDigits:1}).format(n)}function money(n){return n==null?'N/A':'₹'+fmt(n)}function pct(a,b){return b>0?((a-b)/b*100):null}function dateKey(d,mode){if(!d)return'';let x=new Date(d),m=x.getMonth()+1;return mode==='Monthly'?`${x.getFullYear()}-${String(m).padStart(2,'0')}`:`${x.getFullYear()}-${String(m).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`}
function filtered(){let a=rows.filter(isValid),g=id=>document.getElementById(id)?.value||'';let start=g('from'),end=g('to');return a.filter(r=>(!start||r._date&&r._date>=new Date(start))&&(!end||r._date&&r._date<=new Date(end+'T23:59:59'))&&(!g('region')||val(r,'region')===g('region'))&&(!g('dist')||val(r,'distributor')===g('dist'))&&(!g('category')||val(r,'category')===g('category'))&&(!g('retailer')||val(r,'retailer')===g('retailer')))}
function aggregate(a,field,metric='_revenue'){let m=new Map();for(const r of a){let k=val(r,field);if(k==='N/A')continue;m.set(k,(m.get(k)||0)+(r[metric]||0))}return [...m].map(([name,value])=>({name,value})).sort((x,y)=>y.value-x.value)}
function orderCount(a){return distinct(a,'order')}function groupCount(a,f){return distinct(a,f)}function repeatRate(a,entity){let m=new Map();for(const r of a){let k=val(r,entity),o=val(r,'order');if(k!=='N/A'&&o!=='N/A'){if(!m.has(k))m.set(k,new Set());m.get(k).add(o)}}let e=[...m.values()];return e.length?100*e.filter(x=>x.size>1).length/e.length:null}
function previous(a){let ds=a.map(r=>r._date).filter(Boolean).sort((x,y)=>x-y);if(!ds.length)return[];let lo=ds[0],hi=ds.at(-1),span=hi-lo;return rows.filter(isValid).filter(r=>r._date&&r._date<lo&&r._date>=new Date(lo-span-1))}
function kpi(label,value,hint=''){return `<div class="card kpi"><div class="label">${label}</div><div class="value">${value}</div><div class="hint">${hint}</div></div>`}
function chart(title,data,type='bar',limit=10){return `<div class="card"><h3>${title}</h3><div class="chart" data-chart='${esc(JSON.stringify({data:data.slice(0,limit),type}))}'></div></div>`}
function drawCharts(){document.querySelectorAll('[data-chart]').forEach(el=>{let {data,type}=JSON.parse(el.dataset.chart);if(!data.length){el.innerHTML='<div class="empty">Not available in the uploaded data</div>';return}let W=620,H=220,L=44,R=12,T=10,B=38,max=Math.max(1,...data.map(x=>x.value)),plotH=H-T-B,plotW=W-L-R;let bars=type==='line'?`<polyline class="line" points="${data.map((x,i)=>`${L+(data.length===1?0:i*plotW/(data.length-1))},${T+plotH-(x.value/max*plotH)}`).join(' ')}"/>${data.map((x,i)=>`<circle class="dot" cx="${L+(data.length===1?0:i*plotW/(data.length-1))}" cy="${T+plotH-x.value/max*plotH}" r="3"><title>${esc(x.name)}: ${fmt(x.value)}</title></circle>`).join('')}`:data.map((x,i)=>{let step=plotW/data.length,bw=Math.max(8,step*.62),bh=x.value/max*plotH,xx=L+i*step+(step-bw)/2;return `<rect class="bar" x="${xx}" y="${T+plotH-bh}" width="${bw}" height="${bh}" rx="3"><title>${esc(x.name)}: ${fmt(x.value)}</title></rect>`}).join('');let labels=data.map((x,i)=>`<text x="${L+(i+.5)*plotW/data.length}" y="${H-8}" text-anchor="middle">${esc(x.name.length>12?x.name.slice(0,11)+'…':x.name)}</text>`).join('');el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img"><line class="axis" x1="${L}" y1="${T+plotH}" x2="${W-R}" y2="${T+plotH}"/>${bars}${labels}</svg>`})}
function insights(a){let out=[];let region=aggregate(a,'region')[0],dist=aggregate(a,'distributor')[0],cat=aggregate(a,'category')[0],ret=aggregate(a,'retailer')[0];if(region)out.push(`Highest revenue region: ${region.name} at ${money(region.value)} in the selected period.`);if(dist)out.push(`Leading distributor: ${dist.name} with ${money(dist.value)}.`);if(ret)out.push(`Top retailer: ${ret.name} with ${money(ret.value)}.`);if(cat)out.push(`Largest category by revenue: ${cat.name} at ${money(cat.value)}.`);let total=sum(a,'_revenue');if(dist&&total)out.push(`The leading distributor contributes ${(100*dist.value/total).toFixed(1)}% of filtered revenue. Review this concentration alongside territory and account context.`);if(!out.length)out.push('Upload a dataset with revenue and entity fields to generate evidence-based observations.');return out}
function filters(){let vals=f=>[...new Set(rows.map(r=>val(r,f)).filter(x=>x!=='N/A'))].sort();let opts=(id,a)=>`<select id="${id}"><option value="">All</option>${a.map(x=>`<option>${esc(x)}</option>`).join('')}</select>`;let ds=rows.map(r=>r._date).filter(Boolean).sort((a,b)=>a-b);let min=ds[0]?.toISOString().slice(0,10)||'',max=ds.at(-1)?.toISOString().slice(0,10)||'';return `<div class="filters"><div class="field"><label>From</label><input type="date" id="from" value="${min}" min="${min}" max="${max}"></div><div class="field"><label>To</label><input type="date" id="to" value="${max}" min="${min}" max="${max}"></div><div class="field"><label>Region</label>${opts('region',vals('region'))}</div><div class="field"><label>Distributor</label>${opts('dist',vals('distributor'))}</div><div class="field"><label>Retailer</label>${opts('retailer',vals('retailer'))}</div><div class="field"><label>Category</label>${opts('category',[...new Set([...CATS,...vals('category')])])}</div><button class="btn" id="resetfilters">Reset Filters</button><button class="btn" id="resetanalysis">Reset Analysis</button><button class="btn" id="clear">Clear Uploaded Data</button></div>`}
function tableBlock(title,head,data,exportName){let headers=head;return `<div class="card full"><div class="sectionhead"><h3>${title}</h3><button class="btn export" data-export="${exportName}">Export CSV</button></div><div class="toolbar"><input id="search" placeholder="Search…"/><span class="sub">${data.length} rows</span></div><div class="tablewrap"><table class="table"><thead><tr>${headers.map(h=>`<th data-sort="${h}">${h} ↕</th>`).join('')}</tr></thead><tbody id="tbody"></tbody></table></div><div class="pagination"><span id="pageinfo"></span><div><button class="btn" id="prev">Previous</button> <button class="btn" id="next">Next</button></div></div><div class="tabledata hidden">${JSON.stringify(data).replace(/</g,'\\u003c')}</div></div>`}
function tableData(a,type){if(type==='dist')return aggregate(a,'distributor').map((x,i)=>{let sub=a.filter(r=>val(r,'distributor')===x.name);let old=previous(sub),growth=pct(x.value,sum(old,'_revenue'));return {Rank:i+1,Distributor:x.name,Region:val(sub[0],'region'),Retailers:groupCount(sub,'retailer'),Orders:orderCount(sub),Revenue:money(x.value),'Repeat %':repeatRate(sub,'retailer')==null?'N/A':repeatRate(sub,'retailer').toFixed(1)+'%',Growth:growth==null?'N/A':growth.toFixed(1)+'%'}});if(type==='ret')return aggregate(a,'retailer').map((x,i)=>{let s=a.filter(r=>val(r,'retailer')===x.name);let g=pct(x.value,sum(previous(s),'_revenue'));return {Rank:i+1,Retailer:x.name,Region:val(s[0],'region'),Distributor:val(s[0],'distributor'),Orders:orderCount(s),Revenue:money(x.value),Growth:g==null?'N/A':g.toFixed(1)+'%'}});if(type==='sku')return aggregate(a,'sku').map((x,i)=>{let s=a.filter(r=>val(r,'sku')===x.name),u=sum(s,'_units'),days=Math.max(1,Math.ceil((Math.max(...s.map(r=>r._date?.getTime()||0))-Math.min(...s.map(r=>r._date?.getTime()||0)))/864e5)+1);return {SKU:x.name,Product:val(s[0],'product'),Category:val(s[0],'category'),Units:fmt(u),Revenue:money(x.value),Velocity:(u/days).toFixed(2)+' units/day'}});return aggregate(a,'category').map(x=>({Category:x.name,'Units Sold':fmt(sum(a.filter(r=>val(r,'category')===x.name),'_units')),Revenue:money(x.value),'Revenue Share %':sum(a,'_revenue')?(100*x.value/sum(a,'_revenue')).toFixed(1)+'%':'N/A','Growth %':'N/A'}))}
function tableEvents(data){let root=document.querySelector('.tabledata');if(!root)return;let all=JSON.parse(root.textContent);let search=document.getElementById('search');let renderTable=()=>{let d=all.filter(r=>Object.values(r).some(v=>String(v).toLowerCase().includes(search.value.toLowerCase())));d.sort((a,b)=>{let x=a[sort.key],y=b[sort.key];return String(x).localeCompare(String(y),undefined,{numeric:true})*sort.dir});let pages=Math.max(1,Math.ceil(d.length/tableLimit));pageNum=Math.min(pageNum,pages);document.getElementById('tbody').innerHTML=d.slice((pageNum-1)*tableLimit,pageNum*tableLimit).map(r=>`<tr>${Object.values(r).map(v=>`<td>${esc(v)}</td>`).join('')}</tr>`).join('');document.getElementById('pageinfo').textContent=`Page ${pageNum} of ${pages} · ${d.length} rows`;document.getElementById('prev').disabled=pageNum<=1;document.getElementById('next').disabled=pageNum>=pages};search.oninput=()=>{pageNum=1;renderTable()};document.querySelectorAll('[data-sort]').forEach(th=>th.onclick=()=>{let key=th.dataset.sort;sort={key,dir:sort.key===key?-sort.dir:-1};renderTable()});document.getElementById('prev').onclick=()=>{pageNum--;renderTable()};document.getElementById('next').onclick=()=>{pageNum++;renderTable()};document.querySelector('.export').onclick=()=>downloadCSV(all,document.querySelector('.export').dataset.export);renderTable()}
function downloadCSV(data,name){if(!data.length)return;let cols=Object.keys(data[0]),csv=[cols.join(','),...data.map(r=>cols.map(k=>'"'+String(r[k]??'').replace(/"/g,'""')+'"').join(','))].join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=name+'.csv';a.click();URL.revokeObjectURL(a.href)}
function savedItems(){try{return JSON.parse(localStorage.getItem('droolsPulseSaved')||'[]')}catch{return []}}
function saveCurrent(){let title=document.getElementById('saveTitle').value.trim()||('Analysis '+new Date().toLocaleString());let note=document.getElementById('saveNote').value.trim();let item={id:Date.now().toString(),title,note,savedAt:new Date().toISOString(),fileNames:files.map(f=>f.name),map,raw};let all=savedItems();all.unshift(item);try{localStorage.setItem('droolsPulseSaved',JSON.stringify(all));render()}catch(e){alert('This snapshot is too large for browser storage. Download it from this section to keep a copy.')}}
function downloadSaved(item){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(item,null,2)],{type:'application/json'}));a.download=(item.title||'drools-pulse-snapshot').replace(/[^a-z0-9-_]+/gi,'_')+'.json';a.click();URL.revokeObjectURL(a.href)}
function restoreSaved(id){let item=savedItems().find(x=>x.id===id);if(!item)return;raw=item.raw||[];map=item.map||{};files=(item.fileNames||['Saved snapshot']).map(name=>({name}));activePage='Executive Dashboard';document.getElementById('pagetitle').textContent=activePage;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===activePage));analyze()}
function deleteSaved(id){localStorage.setItem('droolsPulseSaved',JSON.stringify(savedItems().filter(x=>x.id!==id)));render()}
function render(){let prior={};document.querySelectorAll('.filters select,.filters input').forEach(x=>prior[x.id]=x.value);let app=document.getElementById('app');if(!rows.length&&activePage!=='Saved Items'){app.innerHTML=`<div class="empty"><div style="font-size:28px;margin-bottom:10px">◈</div><b>Upload a workbook to begin</b><p>Choose an Excel or CSV file. Data is analyzed in this browser; no business data is sent to an AI service.</p><label class="btn primary">Upload Excel File<input type="file" accept=".xlsx,.xls,.csv" multiple hidden onchange="document.getElementById('file').files=this.files;document.getElementById('file').dispatchEvent(new Event('change'))"></label></div>`;return}app.innerHTML=filters()+`<div id="content"></div>`;document.querySelectorAll('.filters select,.filters input').forEach(x=>{if(prior[x.id]!==undefined)x.value=prior[x.id]});let c=document.getElementById('content'),a=filtered(),rev=sum(a,'_revenue'),units=sum(a,'_units'),orders=orderCount(a),distributors=groupCount(a,'distributor'),retailers=groupCount(a,'retailer'),avg=orders?rev/orders:null,old=previous(a),growth=pct(rev,sum(old,'_revenue'));let period=a.map(r=>r._date).filter(Boolean).sort((x,y)=>x-y);let periodText=period.length?period[0].toLocaleDateString()+' – '+period.at(-1).toLocaleDateString():'Date field unavailable';let missing=FIELDS.filter(f=>!map[f]);let exec=`<div class="sectionhead"><div><h2>Executive overview</h2><div class="period">${periodText} · ${a.length} valid records</div></div><span class="pill">${files.map(f=>esc(f.name)).join(', ')}</span></div><div class="grid kpis">${kpi('Total Revenue',money(map.revenue?rev:null),'Sum of valid revenue')}${kpi('Total Units Sold',fmt(map.units?units:null),'Sum of valid units')}${kpi('Total Orders',map.order?fmt(orders):'N/A','Distinct valid order IDs')}${kpi('Total Distributors',map.distributor?fmt(distributors):'N/A','Distinct distributors')}${kpi('Total Retailers',map.retailer?fmt(retailers):'N/A','Distinct retailers')}${kpi('Active Retailers',map.retailer?fmt(retailers):'N/A','Retailer with a valid selected-period record')}${kpi('Revenue Growth',growth==null?'N/A':growth.toFixed(1)+'%',growth==null?'Comparable prior period unavailable':'Versus comparable preceding interval')}${kpi('Average Order Value',avg==null?'N/A':money(avg),'Revenue / distinct order IDs')}</div><div class="grid charts">${chart('Revenue Trend',aggregate(a,'date').length?trendData(a):[],'line')}${chart('Regional Revenue',aggregate(a,'region'))}${chart('Distributor Performance',aggregate(a,'distributor'))}${chart('Category Revenue Mix',aggregate(a,'category'))}${chart('Top 10 Retailers',aggregate(a,'retailer'))}${chart('Top 10 Products',aggregate(a,'product'))}<div class="card full"><h3>Executive insights</h3><div class="insights">${insights(a).map(x=>`<div class="insight">${esc(x)}</div>`).join('')}</div></div></div>${missing.length?`<div class="notice">Unavailable fields: ${missing.map(x=>LABEL[x]).join(', ')}. Dependent metrics are shown as N/A. Period filter: ${periodText}.</div>`:''}`;
if(activePage==='Executive Dashboard')c.innerHTML=exec;
if(activePage==='Distributors'){let d=tableData(a,'dist');c.innerHTML=`<div class="sectionhead"><div><h2>Distributor intelligence</h2><div class="period">Active means at least one valid selected-period record. Revenue per distributor uses ${fmt(distributors)} eligible distributors.</div></div></div><div class="grid kpis">${kpi('Total Distributors',fmt(distributors))}${kpi('Active Distributors',fmt(distributors))}${kpi('Distributor Revenue',money(map.revenue?rev:null))}${kpi('Revenue per Distributor',distributors?money(rev/distributors):'N/A','Filtered eligible distributor count')}${kpi('Total Orders',map.order?fmt(orders):'N/A')}${kpi('Avg Orders / Distributor',distributors&&map.order?fmt(orders/distributors):'N/A')}${kpi('Repeat Rate',repeatRate(a,'retailer')==null?'N/A':repeatRate(a,'retailer').toFixed(1)+'%','Retailers with >1 distinct order')}${kpi('Revenue Growth',growth==null?'N/A':growth.toFixed(1)+'%')}</div><div class="grid charts">${chart('Distributor revenue ranking',aggregate(a,'distributor'))}${chart('Regional revenue',aggregate(a,'region'))}<div class="card full"><div class="notice">Growth is N/A where a comparable preceding period cannot be established from the available date history. Revenue is summed after excluding cancelled/void rows and exact duplicate records.</div></div>${tableBlock('Distributor Scorecard',['Rank','Distributor','Region','Retailers','Orders','Revenue','Repeat %','Growth'],d,'distributor-scorecard')}</div>`;tableEvents(d)}
if(activePage==='Retail Intelligence'){let d=tableData(a,'ret'),inactive=rows.length?Math.max(0,distinct(rows,'retailer')-retailers):null;let rpt=repeatRate(a,'retailer');c.innerHTML=`<div class="sectionhead"><div><h2>Retail intelligence</h2><div class="period">Inactive and new retailer counts require complete historical retailer coverage.</div></div></div><div class="grid kpis">${kpi('Total Retailers',map.retailer?fmt(distinct(rows,'retailer')):'N/A')}${kpi('Active Retailers',map.retailer?fmt(retailers):'N/A')}${kpi('Inactive Retailers',inactive==null?'N/A':fmt(inactive),'Requires complete retailer master')}${kpi('New Retailers','N/A','Requires reliable full transaction history')}${kpi('Retailer Revenue',money(map.revenue?rev:null))}${kpi('Avg Revenue / Retailer',retailers?money(rev/retailers):'N/A')}${kpi('Repeat Retailer Rate',rpt==null?'N/A':rpt.toFixed(1)+'%')}${kpi('Avg Orders / Retailer',retailers&&map.order?fmt(orders/retailers):'N/A')}</div><div class="grid charts">${chart('Top retailers by revenue',aggregate(a,'retailer'))}${chart('Revenue by region',aggregate(a,'region'))}${chart('Revenue concentration · top 10 retailers',aggregate(a,'retailer'))}${tableBlock('Top Revenue Retailers',['Rank','Retailer','Region','Distributor','Orders','Revenue','Growth'],d,'retailer-report')}</div>`;tableEvents(d)}
if(activePage==='Product Performance'){let d=tableData(a,'sku'),cats=aggregate(a,'category');c.innerHTML=`<div class="sectionhead"><div><h2>Product performance</h2><div class="period">SKU velocity = units / observed date span in selected records. Category fields preserve uploaded labels.</div></div></div><div class="grid kpis">${kpi('Product SKUs',map.sku?fmt(distinct(a,'sku')):'N/A')}${kpi('Categories',map.category?fmt(distinct(a,'category')):'N/A')}${kpi('Units Sold',map.units?fmt(units):'N/A')}${kpi('Product Revenue',money(map.revenue?rev:null))}${kpi('Avg Revenue / SKU',d.length?money(rev/d.length):'N/A')}${kpi('Fastest-Moving SKU',d[0]?.SKU||'N/A','Ranked by units/day')}${kpi('Highest-Revenue Category',cats[0]?.name||'N/A')}${kpi('Category Growth','N/A','Comparable category prior-period mapping not established')}</div><div class="grid charts">${chart('Category revenue',cats)}${chart('Category units',aggregate(a,'category','_units'))}${tableBlock('Category Revenue',['Category','Units Sold','Revenue','Revenue Share %','Growth %'],tableData(a,'cat'),'category-report')}${tableBlock('SKU Performance',['SKU','Product','Category','Units','Revenue','Velocity'],d,'sku-performance')}</div>`;document.querySelectorAll('.export').forEach(b=>b.onclick=()=>downloadCSV(JSON.parse(b.closest('.card').querySelector('.tabledata').textContent),b.dataset.export));document.querySelectorAll('.card.full').forEach(card=>tableEvents(JSON.parse(card.querySelector('.tabledata').textContent)))}
if(activePage==='Saved Items'){let saved=savedItems();c.innerHTML=`<div class="sectionhead"><div><h2>Saved Items</h2><div class="period">Save a restorable copy of the uploaded data, field mappings and a note in this browser.</div></div></div><div class="card" style="margin-bottom:16px"><h3>Save current analysis</h3><div class="toolbar"><input id="saveTitle" placeholder="Name this snapshot" style="min-width:220px"><input id="saveNote" placeholder="Add a note (optional)" style="min-width:260px"><button class="btn primary" id="saveNow">Save snapshot</button></div><div class="sub">Current source: ${esc(files.map(f=>f.name).join(', '))} · ${rows.length} records. Saved locally in this browser; use Download JSON for a portable copy.</div></div><div class="grid">${saved.length?saved.map(x=>`<div class="card"><div class="sectionhead"><div><h3>${esc(x.title)}</h3><div class="period">Saved ${esc(new Date(x.savedAt).toLocaleString())} · ${(x.raw||[]).length} records</div></div></div><p class="sub">${esc(x.note||'No note')}</p><div class="toolbar"><button class="btn primary" data-restore="${esc(x.id)}">Open snapshot</button><button class="btn" data-download="${esc(x.id)}">Download JSON</button><button class="btn" data-delete="${esc(x.id)}">Delete</button></div></div>`).join(''):'<div class="empty">No saved items yet. Analyze a file, name the snapshot above, and save it here.</div>'}</div>`;document.getElementById('saveNow').onclick=saveCurrent;document.querySelectorAll('[data-restore]').forEach(b=>b.onclick=()=>restoreSaved(b.dataset.restore));document.querySelectorAll('[data-download]').forEach(b=>b.onclick=()=>{let x=savedItems().find(x=>x.id===b.dataset.download);if(x)downloadSaved(x)});document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>deleteSaved(b.dataset.delete));return}
drawCharts();document.getElementById('resetfilters').onclick=()=>{document.querySelectorAll('.filters select').forEach(x=>x.value='');document.getElementById('from').value='';document.getElementById('to').value='';render()};document.getElementById('resetanalysis').onclick=()=>{activePage='Executive Dashboard';raw=[];rows=[];files=[];document.getElementById('analyzed').textContent='Awaiting first analysis';document.getElementById('filename').textContent='No data loaded';render()};document.getElementById('clear').onclick=()=>{raw=[];rows=[];files=[];document.getElementById('analyzed').textContent='Awaiting first analysis';document.getElementById('filename').textContent='No data loaded';render()};document.querySelectorAll('.filters select,.filters input').forEach(x=>x.onchange=render)}
function trendData(a){let m=new Map();for(const r of a)if(r._date){let k=dateKey(r._date,'Monthly');m.set(k,(m.get(k)||0)+(r._revenue||0))}return [...m].sort((x,y)=>x[0].localeCompare(y[0])).map(([name,value])=>({name,value}))}
</script></body></html>
